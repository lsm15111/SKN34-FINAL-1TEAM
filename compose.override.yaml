# 로컬 개발용. `docker compose up` 하면 자동으로 덧붙는다.
# api · worker는 코드를 컨테이너에 바인드 마운트하고, 고치면 자동으로 다시 뜬다.
# Windows 폴더를 마운트하면 파일 변경 알림이 안 오므로 폴링을 켠다. 화면(web)은 아래처럼 파일을 복사한다(docker compose watch).
# 내 PC에서 쓰는 포트와 겹치면 .env의 *_HOST_PORT 값을 바꾼다 (DB는 기본 5433: PC에 깔린 PostgreSQL과 안 겹치게).
services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  # 스키마를 올린 뒤, .env에 SEED_PASSWORD가 있으면 시험 계정도 만든다 (계정을 못 만들어도 api는 뜬다)
  migrate:
    image: skn34-final/api:dev
    build:
      target: dev
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed --auto"]
    volumes:
      - ./backend:/app
      - files-data:/data/files
    environment:
      SEED_PASSWORD: ${SEED_PASSWORD:-}

  api:
    image: skn34-final/api:dev
    build:
      target: dev
    volumes:
      - ./backend:/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      # 로컬 시험 계정 비밀번호 (python -m app.seed). 로컬 구성에만 넘긴다
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"

  worker:
    image: skn34-final/api:dev
    build:
      target: dev
    command: ["arq", "app.worker.WorkerSettings", "--watch", "app"]
    volumes:
      - ./backend:/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"

  # 화면은 폴더를 마운트하지 않는다. `docker compose watch`(또는 `docker compose up --watch`)가 바뀐 파일만 컨테이너 안으로 복사하고,
  # 컨테이너 안에서 파일이 바뀌니 변경 알림이 와서 폴링 없이 Turbopack(next dev 기본값)으로 바로 다시 컴파일한다.
  # watch 없이 `up`만 하면 이미지를 만든 때의 화면 코드로 뜬다. package.json · 잠금 파일이 바뀌면 이미지를 다시 만든다.
  # 컨테이너 안에서 만든 파일은 PC로 돌아오지 않으니 `pnpm gen:api`는 PC에서 돌린다.
  web:
    image: skn34-final/web:dev
    build:
      target: dev
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
