name: CI

# PR과 통합 브랜치에 올라온 코드를 확인한다. 유료 API(LLM)는 부르지 않는다 (LLM_LIVE=false).
# - repository-checks: 저장소 공통 점검 (JSON 문법, 충돌 표시, 줄 끝 공백, .env 추적)
# - backend: ruff, migration head 단일 검증, pytest(실제 PostgreSQL · Redis), 평가 도구(ruff · 테스트 · 사례 점검),
#   스키마 차이 검사, API 명세 저장
# - frontend: API 타입이 명세와 같은지, typecheck, lint, build
# - containers: Compose 설정, 운영용 API · 웹 이미지 빌드, 컨테이너 실행 확인

on:
  push:
    branches:
      - main
      - integration
  pull_request:
    branches:
      - main
      - integration
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate repository
        run: |
          python3 -m compileall -q .github/scripts
          python3 .github/scripts/check_repo.py

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mitjip
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mitjip
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mitjip" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_USER: mitjip
      POSTGRES_PASSWORD: ci-only-password
      DB_HOST_PORT: "5433"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: migration head가 하나인지 (둘이면 rebase 뒤 내 revision의 down_revision을 최신 head로 바꾼다)
        run: |
          heads=$(uv run alembic heads | wc -l)
          echo "heads: $heads"
          test "$heads" -eq 1
      - name: pytest
        run: uv run pytest -q
      # 평가 도구(evaluation/): DB · LLM 없이 돈다. 사례 점검은 커밋한 표본(sample_100)으로 한다
      - name: 평가 도구 (ruff · 테스트 · 사례 무료 점검)
        env:
          LLM_LIVE: "false"
        run: |
          uv run ruff check ../evaluation && uv run ruff format --check ../evaluation
          uv run pytest -q -p no:cacheprovider ../evaluation/tests
          uv run python ../evaluation/check_cases.py
      - name: DB 모델과 마이그레이션 일치 검사
        env:
          APP_ENV: test
        run: |
          export DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${DB_HOST_PORT}/mitjip_test"
          uv run alembic check
      # 서버를 띄우지 않고 앱에서 바로 뽑는다. 백그라운드 서버가 남으면 setup-uv의 캐시 정리가 잠금을 기다리다 실패한다
      - name: API 명세 저장 (프런트 타입 비교용)
        env:
          APP_ENV: local
        run: uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > ../openapi.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openapi
          path: openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    needs: backend
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          name: openapi
          path: .
      - name: API 타입이 명세와 같은지 (API를 바꾸고 pnpm gen:api를 안 돌리면 실패)
        run: |
          pnpm exec openapi-typescript ../openapi.json -o lib/backend/schema.d.ts
          git diff --exit-code -- lib/backend/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Docker Compose 개발·운영 구성 검증
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.override.yaml config --quiet
      - name: FastAPI 운영 이미지 빌드
        run: docker build --target prod --tag mitjip-api:ci ./backend
      - name: FastAPI 이미지 내부 모듈 검사
        run: |
          docker run --rm -e APP_ENV=test -e LLM_LIVE=false mitjip-api:ci \
            python -c "from app.main import app; assert '/health/live' in app.openapi()['paths']"
      - name: Next.js 운영 이미지 빌드
        run: docker build --target prod --tag mitjip-web:ci ./frontend
      - name: Next.js 컨테이너 HTTP 응답 검사
        run: |
          docker run -d --name ci-web --publish 127.0.0.1:38080:3000 mitjip-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:38080/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ci-web
          exit 1
      - name: 테스트 컨테이너 정리
        if: always()
        run: docker rm --force ci-web 2>/dev/null || true
