<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>믿집 상담 v10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 흰 바탕 자재 보드: 왼쪽은 대화, 오른쪽은 고른 것이 쌓이는 '내 집 보드'. 강조색은 버튼 · 선택 · 진행에만 쓴다 */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #f7f7f5;
  --surface-2: #f1f0ec;
  --line: #e6e4df;
  --line-strong: #d5d2cb;
  --ink: #1a1a1a;
  --ink-sub: #4d4d4d;
  --ink-mute: #6e6e6e;
  --accent: #2d6cb5;
  --accent-hover: #24599a;
  --accent-weak: #eef4fb;
  --on-accent: #ffffff;
  --eco-bg: #f1f0ec; --eco: #4d4d4d;
  --basic-bg: #eef4fb; --basic: #24599a;
  --prem-bg: #f6f0e6; --prem: #7a5a2b;
  --ok: #1e6b4f; --warn: #8f5600; --danger: #b42318;
  --sh-float: 0 4px 12px rgba(0,0,0,.08);
  --sh-overlay: 0 12px 32px rgba(0,0,0,.12);
  --scrim: rgba(20,20,20,.36);
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --fs-xs: 13px; --fs-sm: 14px; --fs-md: 15px; --fs-lg: 17px; --fs-h3: 20px; --fs-h2: 24px; --fs-h1: 30px;
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: var(--fs-md); line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
input, textarea { font-size: 16px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.3; letter-spacing: -0.015em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-mute); font-size: var(--fs-sm); }

/* 머리 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; text-decoration: none; color: var(--ink); }
.logo svg { width: 24px; height: 24px; }
.pill-ai { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-weak); border-radius: 99px; padding: 2px 9px; }
.top .spacer { flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 99px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 99px; padding: 0 12px; min-height: 40px; font-size: var(--fs-xs); color: var(--ink-sub); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg.lg button { min-height: 40px; font-size: var(--fs-sm); padding: 0 14px; }

/* 버튼 · 칩 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface); }
.btn-pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn-pri:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: var(--fs-sm); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-text { border: 0; background: none; color: var(--accent); font-weight: 500; cursor: pointer; padding: 0 4px; min-height: 40px; font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 4px; }
.btn-text:hover { text-decoration: underline; }
.btn-text.gray { color: var(--ink-mute); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--bg); font-size: var(--fs-sm); cursor: pointer; color: var(--ink); white-space: nowrap; }
.chip:hover { border-color: var(--ink-mute); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 700; }
.chip.ghost { background: var(--surface); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tier { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.tier-economy { color: var(--eco); background: var(--eco-bg); }
.tier-basic { color: var(--basic); background: var(--basic-bg); }
.tier-premium { color: var(--prem); background: var(--prem-bg); }
.spark { font-size: 11px; }

/* 사진 */
.ph { position: relative; margin: 0; background: var(--surface-2); overflow: hidden; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph .swatch-fill { position: absolute; inset: 0; }

/* ===== 첫 화면 ===== */
.home { padding-block: 56px 72px; display: grid; gap: 56px; }
.hero { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 48px; align-items: center; }
.hero h1 { font-size: 38px; font-weight: 700; letter-spacing: -0.025em; }
.hero .lead { margin-top: 14px; color: var(--ink-sub); font-size: var(--fs-lg); }
.hero .cta { margin-top: 32px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.hero .cta .btn-pri { min-height: 54px; padding: 0 30px; font-size: var(--fs-lg); border-radius: var(--r-lg); }
.collage { display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 170px 170px; gap: 8px; }
.collage .ph { border-radius: var(--r-lg); }
.collage .ph:first-child { grid-row: span 2; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 0; margin: 0; }
.flow li { list-style: none; border-top: 2px solid var(--ink); padding-top: 12px; display: grid; gap: 2px; }
.flow li.later { border-color: var(--line-strong); color: var(--ink-mute); }
.flow span { font-size: var(--fs-xs); color: var(--ink-mute); }
.flow b { font-size: var(--fs-lg); }

/* ===== 대화 화면 ===== */
.chatview { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
.thread { min-width: 0; display: flex; flex-direction: column; min-height: calc(100vh - 61px); max-width: 760px; width: 100%; justify-self: center; }
.stepper { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 10; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.steps { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.steps button { flex: 1 0 auto; border: 0; background: none; padding: 6px 2px 0; min-height: 40px; display: grid; gap: 6px; align-content: start; cursor: default; color: var(--ink-mute); font-size: 12px; text-align: left; }
.steps button::before { content: ""; height: 3px; border-radius: 3px; background: var(--line); }
.steps button.done { color: var(--ink-sub); cursor: pointer; }
.steps button.done::before { background: var(--ink); }
.steps button.now { color: var(--accent); font-weight: 700; }
.steps button.now::before { background: var(--accent); }
.reset-ask { display: flex; gap: 6px; align-items: center; font-size: var(--fs-xs); color: var(--ink-sub); white-space: nowrap; }
.msgs { display: flex; flex-direction: column; gap: 20px; padding: 24px 0; flex: 1; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg .body { min-width: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.msg .body > * { min-width: 0; }
.msg.me { justify-content: flex-end; }
.msg.me .body { justify-items: end; }
.av { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; margin-top: 2px; }
.bubble { max-width: 620px; white-space: pre-wrap; font-size: var(--fs-md); }
.msg:not(.me) .bubble { padding-top: 3px; }
.msg.me .bubble { background: var(--surface-2); padding: 10px 16px; border-radius: 18px 18px 4px 18px; }
.bubble.ai { background: none; }
.applied { font-size: var(--fs-xs); color: var(--ok); }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; min-width: 0; display: grid; gap: 16px; }
.card h3 { font-size: var(--fs-lg); }
.card.done { opacity: .55; pointer-events: none; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.typing { display: inline-flex; gap: 4px; padding: 10px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }

/* 스타일 카드 줄 */
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 4px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.style-card { flex: 0 0 calc((100% - 24px) / 2.4); scroll-snap-align: start; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }
.style-card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.style-card .ph { aspect-ratio: 4 / 3; }
.style-card .in { padding: 14px 14px 0; display: grid; gap: 8px; flex: 1; align-content: start; }
.style-card h3 { font-size: var(--fs-lg); }
.style-card .keys { font-size: var(--fs-sm); color: var(--ink-sub); }
.pal { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
.pal span { flex: 1; }
.style-card .foot { padding: 14px; display: flex; gap: 4px; align-items: center; }
.style-card .foot .btn { flex: 1; }
.rail-nav { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.rail-nav .count { font-size: var(--fs-xs); color: var(--ink-mute); margin-right: 6px; }
.rail-nav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--bg); cursor: pointer; font-size: 16px; }

/* 공사 순서 */
.guide { padding: 0; margin: 0; display: grid; }
.guide li { list-style: none; display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.guide li:last-child { border-bottom: 0; }
.guide .n { font-size: var(--fs-xs); color: var(--ink-mute); font-variant-numeric: tabular-nums; }
.guide b { font-weight: 700; }
.guide p { font-size: var(--fs-sm); color: var(--ink-sub); }
.guide .d { font-size: var(--fs-xs); color: var(--ink-mute); white-space: nowrap; }
.guide li.mine .n { color: var(--accent); font-weight: 700; }

/* 폼 */
.field { display: grid; gap: 8px; }
.field > .lbl { font-size: var(--fs-sm); font-weight: 700; }
.inp { min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 0 12px; background: var(--bg); width: 100%; max-width: 280px; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-weak); }
.inp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.err { font-size: var(--fs-xs); color: var(--warn); }
.budget-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.budget-row .inp { max-width: 140px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.range { width: 100%; accent-color: var(--accent); min-height: 40px; }
.tier-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tier-pick button { position: relative; text-align: left; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--bg); padding: 12px; cursor: pointer; display: grid; gap: 4px; min-height: 72px; }
.tier-pick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-weak); }
.tier-pick b { font-size: var(--fs-md); }
.tier-pick small { color: var(--ink-mute); font-size: 12px; }
.tier-pick .rec { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; color: var(--accent); }

/* 올리기 */
.drops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 10px; justify-items: start; background: var(--surface); min-width: 0; }
.drop.over { border-color: var(--accent); background: var(--accent-weak); }
.drop b { font-size: var(--fs-sm); }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.thumbs .t { position: relative; width: 64px; height: 64px; border-radius: var(--r-sm); overflow: hidden; }
.thumbs .t img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs .t button { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; font-size: 13px; line-height: 1; }

/* 도면 */
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.plan { border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--bg); padding: 10px; cursor: pointer; text-align: left; display: grid; gap: 6px; }
.plan[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.plan svg { width: 100%; height: auto; display: block; }
.plan b { font-size: var(--fs-sm); }
.plan small { font-size: 12px; color: var(--ink-mute); }
.plan-svg rect, .plan-svg line { fill: none; stroke: var(--line-strong); stroke-width: 1.4; }
.plan-svg .wall { stroke-width: 3; stroke: var(--ink-sub); }
.plan-svg .wet { fill: var(--accent-weak); stroke: var(--accent); }
.plan-svg text { fill: var(--ink-sub); font-family: var(--font); font-size: 9px; }

/* 자재 고르기 */
.mat { padding: 0; gap: 0; overflow: hidden; }
.mat-head { padding: 18px 20px 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.mat-head h3 { display: flex; gap: 8px; align-items: baseline; }
.mat-head h3 small { font-size: var(--fs-sm); color: var(--ink-mute); font-weight: 500; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 20px 14px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs button { flex: none; border: 1px solid var(--line-strong); background: var(--bg); padding: 0 14px; min-height: 40px; border-radius: 99px; cursor: pointer; color: var(--ink-sub); font-size: var(--fs-sm); display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
.tabs .ck { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; background: var(--accent); color: #fff; }
.tabs button[aria-selected="true"] .ck { background: #fff; color: var(--ink); }
.mat-body { padding: 18px 20px; display: grid; gap: 14px; }
.cat-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cat-line p { font-size: var(--fs-sm); color: var(--ink-mute); }
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mcard { position: relative; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; background: var(--bg); min-width: 0; cursor: pointer; text-align: left; padding: 0; }
.mcard:hover { border-color: var(--line-strong); }
.mcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mcard .ph { aspect-ratio: 1; }
.mcard .sel { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.9); border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 13px; color: transparent; }
.mcard[aria-pressed="true"] .sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.mcard .in { padding: 12px; display: grid; gap: 4px; }
.mcard .nm { font-weight: 500; font-size: var(--fs-sm); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.mcard .price { font-weight: 700; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); white-space: nowrap; }
.mcard .flag { font-size: 11px; color: var(--ink-mute); }
.mcard .brand { font-size: 12px; color: var(--ink-mute); }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec-head h4 { font-size: var(--fs-md); display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.sec-head h4 small { font-size: var(--fs-xs); color: var(--ink-mute); font-weight: 400; }
.mlist-wrap { display: grid; gap: 10px; padding-top: 18px; margin-top: 4px; border-top: 1px solid var(--line); }
.mlist-wrap > .seg { justify-self: start; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg .n { margin-left: 4px; font-size: 11px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
.sort { min-height: 40px; border: 1px solid var(--line-strong); border-radius: 99px; background: var(--bg); color: var(--ink); padding: 0 32px 0 14px; font: inherit; font-size: var(--fs-sm); cursor: pointer; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-mute) 50%), linear-gradient(135deg, var(--ink-mute) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.mlist { display: grid; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px; padding-right: 12px; background: var(--bg); }
.mrow + .mrow { border-top: 1px solid var(--line); }
.mrow[aria-current="true"] { background: var(--accent-weak); }
.mrow-main { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px 10px 12px; cursor: pointer; min-width: 0; }
.mrow-main:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
.mrow .ph { width: 64px; height: 64px; border-radius: var(--r-sm); }
.mrow .tx { display: grid; gap: 3px; min-width: 0; }
.mrow .mtop { display: flex; gap: 6px; align-items: center; min-width: 0; }
.mrow .brand { font-size: 12px; color: var(--ink-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .nm { font-size: var(--fs-sm); font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; color: var(--ink-sub); background: var(--surface-2); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.mrow .pr { display: grid; justify-items: end; text-align: right; }
.mrow .pr b { font-size: var(--fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mrow .pr small { font-size: 11px; color: var(--ink-mute); white-space: nowrap; }
.pick { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink-sub); font-size: 18px; cursor: pointer; display: grid; place-items: center; flex: none; }
.pick:hover { border-color: var(--accent); color: var(--accent); }

.btn.more { justify-self: stretch; gap: 8px; }

.sheet .tags .tag { font-size: 12px; padding: 2px 8px; }
.resume { margin-top: 18px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; background: var(--surface); max-width: 460px; }

.tagrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }

.chip .n { font-size: 11px; color: var(--ink-mute); }
.pinned { display: grid; gap: 6px; }

.empty { padding: 12px 0; }
.cmp-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--accent-weak); border-radius: var(--r-md); padding: 6px 6px 6px 14px; font-size: var(--fs-sm); }

.tabs .add { flex: none; border: 1px dashed var(--line-strong); background: var(--bg); padding: 0 14px; min-height: 40px; border-radius: 99px; cursor: pointer; color: var(--ink-mute); font-size: var(--fs-sm); }
.addbox { padding: 12px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; background: var(--surface); }
.addbox .lbl { font-size: 12px; font-weight: 700; color: var(--ink-mute); }
.mat-foot { justify-content: space-between; align-items: center; }
.sheet.cmp { display: block; width: min(960px, 100%); }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 8px; }
.cmp-head .x { margin: 0; }
.cmp-scroll { overflow-x: auto; padding: 0 20px 20px; }
.cmp table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: var(--fs-sm); }
.cmp th, .cmp td { text-align: left; vertical-align: top; padding: 10px 8px; border-top: 1px solid var(--line); }
.cmp thead th { border-top: 0; font-weight: 400; width: 30%; }

.copy-fallback { width: 100%; font: inherit; font-size: var(--fs-xs); border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 10px; }
.sheet .proof { list-style: none; padding: 10px 12px; margin: 0; display: grid; gap: 6px; font-size: var(--fs-xs); color: var(--ink-sub); background: var(--accent-weak); border-radius: var(--r-sm); }
.sheet .proof b { color: var(--accent); font-weight: 700; margin-right: 2px; }
.sheet .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: var(--fs-sm); }
.sheet .facts dt { color: var(--ink-mute); }
.mat-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }

/* 입력창 */
.composer { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 82%, rgba(255,255,255,0)); padding: 14px 0 calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; z-index: 5; }
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }

.cbox { display: flex; gap: 8px; align-items: flex-end; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 26px; padding: 6px 6px 6px 18px; box-shadow: var(--sh-float); }
.cbox:focus-within { border-color: var(--accent); }
.cbox textarea { flex: 1; border: 0; background: transparent; resize: none; min-height: 40px; max-height: 140px; padding: 8px 0; outline: none; line-height: 1.5; }
.cbox .send { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; font-size: 18px; display: grid; place-items: center; }
.cbox .send:disabled { background: var(--line-strong); }
.with-photos { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-xs); color: var(--ink-sub); min-height: 32px; cursor: pointer; }
.board-band { display: none; }

/* 내 집 보드 */
.board { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 92px); overflow-y: auto; margin-top: 16px; background: var(--surface); border-radius: var(--r-xl); padding: 20px; display: grid; gap: 20px; scrollbar-width: thin; }
.board.flash { animation: flash .5s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--accent); } 40% { box-shadow: 0 0 0 3px var(--accent-weak); } 100% { box-shadow: none; } }
.board-head { display: flex; justify-content: space-between; align-items: center; }
.board-head h2 { font-size: var(--fs-lg); }
.board-close { display: none; }
.bsec { display: grid; gap: 10px; }
.bsec > .t { font-size: 12px; color: var(--ink-mute); font-weight: 500; }
.board .hero-ph { aspect-ratio: 16 / 10; border-radius: var(--r-md); }
.mood-name { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mood-name .pal { width: 96px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts span { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }
.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sw { display: grid; gap: 4px; min-width: 0; }
.sw .ph { aspect-ratio: 1; border-radius: var(--r-sm); }
.sw .sw-empty { aspect-ratio: 1; border-radius: var(--r-sm); border: 1.5px dashed var(--line-strong); display: grid; place-items: center; color: var(--ink-mute); font-size: 12px; background: var(--bg); }
.sw span { font-size: 12px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sw span em { font-style: normal; color: var(--ink-mute); display: block; }
.board .empty { font-size: var(--fs-sm); color: var(--ink-mute); }
.mini-thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.mini-thumbs img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
.board .plan-svg { max-height: 120px; background: var(--bg); border-radius: var(--r-sm); }

/* 자세히 창 */
.sheet-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--bg); border-radius: var(--r-xl); width: min(760px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); box-shadow: var(--sh-overlay); }
.sheet > .ph { min-height: 320px; height: 100%; }
.sheet .in { padding: 24px; display: grid; gap: 12px; align-content: start; }
.sheet .x { justify-self: end; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); cursor: pointer; font-size: 18px; margin: -8px -8px 0 0; }
.sheet h3 { font-size: var(--fs-h3); }
.sheet .pv { font-size: var(--fs-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet .spec { font-size: var(--fs-sm); color: var(--ink-sub); background: var(--surface); border-radius: var(--r-sm); padding: 8px 12px; }
.sheet .src { font-size: 12px; color: var(--ink-mute); }
.gw { display: grid; gap: 8px; font-size: var(--fs-sm); margin: 0; }
.gw div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
.gw dt { color: var(--ink-mute); }
.gw dd { margin: 0; }

/* 알림 */
.rail-top { display: flex; justify-content: flex-end; margin-bottom: 8px; }

/* v3 문서 */
.v3sum { gap: 12px; }
.kpi { display: grid; gap: 2px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-md); }
.kpi span { font-size: var(--fs-xs); color: var(--ink-mute); }
.kpi b { font-size: var(--fs-lg); }
.kpi small { font-size: 12px; color: var(--ink-mute); }
.doc-bg { place-items: stretch center; }
.sheet.doc { display: block; width: min(1080px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
.doc-head { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.doc-head .x { margin: 0; }
.doc-body { padding: 16px 20px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.doc-body > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.doc-meta { display: grid; gap: 12px; }
.doc-meta dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: var(--fs-sm); }
.doc-meta dt { color: var(--ink-mute); }
.doc-meta dd { margin: 0; }
.doc-opts { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.chk { display: inline-flex; gap: 6px; align-items: center; min-height: 40px; font-size: var(--fs-sm); white-space: nowrap; }
.chk .inp { width: auto; max-width: 170px; }
.chk input[type=checkbox] { width: 20px; height: 20px; }
.inp.sm { max-width: 90px; min-height: 40px; }
.doc-guide { border-radius: var(--r-md); background: var(--surface); padding: 12px 14px; font-size: var(--fs-sm); }
.doc-guide.vendor { background: #f6f0e6; }
.doc-guide ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink-sub); }
.doc-sec { font-size: var(--fs-md); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin: 4px 0 0; }
.doc-sec small { font-size: var(--fs-xs); color: var(--ink-mute); font-weight: 400; }
.doc-trade { display: grid; gap: 8px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); }
.tbl table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: var(--fs-sm); }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl thead th { border-top: 0; background: var(--surface); font-weight: 500; color: var(--ink-sub); white-space: nowrap; }
.tbl tfoot td { font-weight: 700; background: var(--surface); }
.tbl .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl tr.dim td { color: var(--ink-mute); }
.tbl .calc { font-size: 12px; color: var(--ink-sub); margin-top: 2px; }
.tbl .src { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
.basis { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; background: var(--surface-2); color: var(--ink-sub); }
.basis.b-public { background: var(--accent-weak); color: var(--accent); }
.basis.b-assumed { background: #f6f0e6; color: #7a5a2b; }
.basis.b-pick { background: #eef6f0; color: #2f6b45; }
.st { font-size: 12px; font-weight: 700; }
.st-after_visit, .st-optional { color: #7a5a2b; }
.st-excluded { color: var(--ink-mute); }
.notes { margin: 0; padding-left: 18px; font-size: var(--fs-xs); color: var(--ink-sub); display: grid; gap: 2px; }
.doc-sum { border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 6px; }
.rowsum { display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-sm); flex-wrap: wrap; }
.rowsum.big { font-size: var(--fs-lg); border-top: 1px solid var(--line); padding-top: 6px; }
.warn-line { color: #a4501f; font-size: var(--fs-sm); }
.ok-line { color: var(--ok, #2f6b45); font-size: var(--fs-sm); }
.est-line { font-size: var(--fs-sm); color: var(--accent); font-weight: 500; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px; align-items: center; }
.form-grid .inp { max-width: none; }
.gantt { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); padding: 6px 0; font-size: 12px; }
.g-row { display: flex; align-items: center; min-height: 30px; }
.g-lab { position: sticky; left: 0; z-index: 1; background: var(--bg); flex: none; width: 96px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-lab small { color: var(--ink-mute); }
.g-cells { position: relative; display: flex; height: 26px; flex: none; }
.g-head .g-cells { height: 22px; }
.g-day { flex: none; text-align: center; color: var(--ink-mute); font-size: 11px; line-height: 22px; border-left: 1px solid var(--line); }
.g-day.off { background: var(--surface-2); }
.g-bar { position: absolute; top: 3px; height: 20px; border-radius: 5px; color: #fff; font-size: 11px; line-height: 20px; padding: 0 6px; white-space: nowrap; overflow: hidden; }
.g-bar.g-expected { opacity: .55; }
.g-bar.g-pending { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 4px, transparent 4px 8px) !important; }
.g-bar.g-dry, .g-bar.g-clean { color: var(--ink); }
.gantt.mini .g-lab { width: 72px; }
.date-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 10px; }
.date-card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 8px; font-size: var(--fs-sm); }
.date-card.mine { border-color: var(--accent); background: var(--accent-weak); }
@media (max-width: 520px) {
  .tbl { border: 0; border-radius: 0; overflow: visible; }
  .tbl table { min-width: 0; }
  .tbl thead { display: none; }
  .tbl tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 2px; border-top: 1px solid var(--line); }
  .tbl td { border: 0; padding: 0; }
  .tbl td:first-child { grid-column: 1 / -1; }
  .tbl td.num { text-align: left; font-size: var(--fs-xs); color: var(--ink-sub); }
  .tbl td.num[data-l]::before { content: attr(data-l) " "; color: var(--ink-mute); }
  .tbl td.amt { font-size: var(--fs-sm); color: var(--ink); font-weight: 700; }
  .tbl td.stc { text-align: right; }
  .tbl td.vin { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: var(--fs-xs); color: var(--ink-mute); }
  .tbl td.vin::before { content: attr(data-l); }
  .tbl td.hide-m { display: none; }
  .tbl tfoot tr { background: var(--surface); padding: 10px 8px; border-radius: var(--r-sm); }
  .doc-body { padding: 12px 12px 24px; } .doc-head { padding: 10px 12px; } .sheet.doc { max-height: 100vh; border-radius: 0; } }

/* v4 점검 반영 */
.seg button { min-width: 40px; }
/* 업체 실측 견적서 칸: 파일 칸이 좁은 화면에서 줄지 않던 것 */
.doc-trade, .form-grid > * { min-width: 0; }
.form-grid input[type=file] { width: 100%; font-size: var(--fs-xs); }
.kpi.band { border-color: var(--accent); background: var(--accent-weak); }
.band-line { display: grid; gap: 2px; border-left: 3px solid var(--accent); padding: 6px 0 6px 12px; font-size: var(--fs-sm); }
.band-line span, .band-line small { color: var(--ink-sub); }
.band-line small { font-size: 12px; }
.rowsum.band b { color: var(--accent); }
.band-why { font-size: var(--fs-sm); gap: 8px; }
@media (max-width: 520px) {
  .composer { padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
  .board-band { min-height: 40px; }
  .cbox { padding: 4px 4px 4px 16px; }
  .stepper { padding: 8px 0; }
  .steps button { font-size: 12px; min-width: 48px; }
  .steps button.now { font-size: 13px; }
}
.gantt.fit { overflow: hidden; }
.gantt.fit .g-cells { flex: 1; min-width: 0; }
.gantt.fit .g-day { border-left: 0; }
.g-mark { position: absolute; top: 0; font-size: 11px; font-style: normal; color: var(--ink-mute); white-space: nowrap; line-height: 22px; padding-left: 2px; border-left: 1px solid var(--line-strong); }
.fld { display: grid; gap: 4px; font-size: var(--fs-xs); color: var(--ink-sub); min-width: 0; }
.fld .inp, .fld select { max-width: none; width: 100%; }
/* 자재 고르기 전용 화면 */
.card.mat.mat-full { position: fixed; inset: 0; z-index: 35; margin: 0; border: 0; border-radius: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); grid-auto-rows: max-content;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); align-content: start; }
.mat-full .mat-head { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
.mat-full .tabs { position: sticky; top: var(--mat-head-h, 64px); z-index: 2; background: var(--bg); padding-top: 10px; }
.mat-full .mat-foot { position: sticky; bottom: 0; z-index: 3; background: var(--bg); }
.mat-expand { margin-left: auto; }
body.mat-open { overflow: hidden; }
@media (min-width: 761px) { .card.mat.mat-full { inset: 24px; max-width: 1100px; margin: 0 auto; border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--sh-overlay); } }
/* 휴대폰 아래 영역: 내 집 보드 띠와 빠른 버튼을 한 줄로 */
@media (max-width: 1040px) {
  .composer { grid-template-columns: auto minmax(0, 1fr); }
  .composer > .board-band { grid-column: 1; grid-row: 1; width: auto; padding: 0 12px; gap: 6px; border-radius: 99px; white-space: nowrap; }
  .composer > .board-band .pal { display: none; }
  .composer > .quick { grid-column: 2; grid-row: 1; align-self: center; }
  .composer > .cbox, .composer > .with-photos { grid-column: 1 / -1; }
}
/* 버전 고르기는 시연용 표시 */
.ver::before { content: "시연"; align-self: center; margin-right: 4px; font-size: 11px; font-weight: 700; color: var(--ink-mute); }
.ver select { border-style: dashed; color: var(--ink-sub); }

/* v5 시장 기준 */
.band-line.mk { gap: 4px; }
.mk-more { margin-top: 6px; }
.mk-more > summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; color: var(--accent); font-weight: 700; font-size: var(--fs-sm); }
.mk-more[open] > summary { margin-bottom: 8px; }
.mk-more .tbl { margin-top: 10px; }
.gap { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 12px; font-size: var(--fs-sm); }
.gap-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); align-items: start; }
.gap-row:first-child { border-top: 0; }
.gap-row span { display: grid; gap: 2px; min-width: 0; }
.gap-row small { color: var(--ink-sub); font-size: var(--fs-xs); }
.gap-row.end b { font-size: var(--fs-md); }
.gap-row.down .num { color: #2f6b45; }
.gap-row.up .num { color: #a4501f; }
.gap-bar { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--line-strong); }
.gap-row.down .gap-bar { background: #9cc8a8; }
.gap-row.up .gap-bar { background: #e2b08f; }
.qc .doc-opts { margin-top: 4px; }
.qc-res { border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 6px; font-size: var(--fs-sm); background: var(--surface); }
.qc-res > b { font-size: var(--fs-md); }
.qc-in { background: #eef6f0; } .qc-in > b { color: #2f6b45; }
.qc-high { background: #fbf0e8; } .qc-high > b { color: #a4501f; }
.qc-low { background: #f6f0e6; } .qc-low > b { color: #7a5a2b; }

.qc .chk .cnt { width: 56px; min-height: 40px; margin: 0 4px 0 8px; padding: 4px 8px; }
.qc .doc-opts { flex-wrap: wrap; min-width: 0; }
.qc .doc-opts .chk { flex-wrap: wrap; max-width: 100%; min-width: 0; white-space: normal; }
.qc .chk .cnt { width: 48px; flex: none; }
.route-chip { font-size: var(--fs-xs, 12px); margin-top: 6px; }

.next-btn { margin: 10px 0 0; }
.next-btn .btn { min-height: 44px; }

.srcs { font-size: var(--fs-xs); color: var(--ink-sub); max-width: 620px; }
.srcs summary { cursor: pointer; color: var(--accent); min-height: 40px; display: inline-flex; align-items: center; }

  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

async function runLocal(system, q, files, tools, bubble, signal) {
  const content = [];

  content.push({ type: "text", text: q });
  const messages = [{ role: "user", content }];
  const defs = tools.map((t) => ({ name: t.name, description: t.description, input_schema: t.inputSchema }));
  let text = "", nudged = false;
  for (let round = 0; round < 5; round++) {
    const r = await fetch("api/claude", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system, messages, tools: defs }), signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: j.error?.code || "api", message: j.error?.message || "" };
    const blocks = j.content || [];
    const t = blocks.filter((b) => b.type === "text").map((b) => b.text).join("");
    if (t) { text = text ? text + "\n" + t : t; bubble.textContent = cleanMarks(text); }
    if (j.stop_reason === "refusal") throw { code: "refusal", text };
    messages.push({ role: "assistant", content: blocks });
    if (j.stop_reason === "pause_turn") continue;
    if (j.stop_reason !== "tool_use") {
      if (!text && !nudged && round < 4) {
        nudged = true;
        if (!blocks.length) messages.pop();
        const last = messages[messages.length - 1], ask = "(위 도구 결과로 고객 질문에 대한 답 글을 해요체로 써 주세요.)";
        if (last.role === "user" && Array.isArray(last.content)) last.content.push({ type: "text", text: ask }); else messages.push({ role: "user", content: ask });
        continue;
      }
      return text || "답이 비어 있어요. 다시 물어봐 주세요.";
    }
    const results = [];
    for (const b of blocks.filter((x) => x.type === "tool_use")) {
      const tool = tools.find((x) => x.name === b.name);
      try {
        if (!tool) throw new Error("없는 도구");
        results.push({ type: "tool_result", tool_use_id: b.id, content: JSON.stringify((await tool.execute(b.input || {})) ?? { ok: true }) });
      } catch (e) {
        results.push({ type: "tool_result", tool_use_id: b.id, content: String(e?.message || e), is_error: true });
      }
    }
    messages.push({ role: "user", content: results });
  }
  return text || "답을 마무리하지 못했어요. 다시 물어봐 주세요.";
}

/* ---------- RAG: 공공 기준 · 시공 기준 · 자재 · 분쟁 자료 검색 ----------

    if (/^[0-9a-z]+$/.test(w)) { out.push(w); continue; }
    if (w.length === 1) { out.push(w); continue; }

    const tf = new Map(); for (const t of toks) tf.set(t, (tf.get(t) || 0) + 1);

  askClaude(`믿집 자료의 '${m.brand} ${m.name}'(id ${m.id})이 우리 집에 맞는지 알려 줘. 같은 ${CAT[m.cat].ko} 후보(${same})와 비교해 어떤 사람에게 좋은지, 실측 때 물어볼 것 하나도.`, { label: `${m.name}, 괜찮을까요?` });
}
function askCompare(cat) {
  setMatFull(false);
  const r = recommend(cat).map((m) => `${m.name}(id ${m.id})`).join(", ");
  askClaude(`${CAT[cat].ko} 추천 3가지 ${r}를 비교해서 각각 어떤 집에 좋은지와 내 조건이면 무엇이 좋을지 알려 줘.`, { label: `${CAT[cat].ko} 추천 비교` });
}
function askPhotos() {
  askClaude("올린 사진을 보고 지금 집 상태에서 눈에 띄는 점과, 공사 범위나 자재를 고를 때 참고할 점을 알려 줘. 참고 사진이 있으면 어떤 스타일에 가까운지도.", { label: "사진 보고 조언해 주세요", images: true });
}
function askReview() {
  askClaude("지금까지 고른 스타일 · 등급 · 자재 조합을 보고 서로 잘 어울리는지, 바꾸면 좋을 것, 견적 받기 전에 확인할 것을 짧게 정리해 줘.", { label: "총평해 주세요" });
}

/* ---------- 시작 ---------- */
/* 믿집 계산 엔진(팀 backend/app/calc · refprice, 2026.11.1 / 2026H2)을 그대로 옮긴 것. DOM · 시계 없음.
   수량 · 면적은 소수 1자리 반올림(ROUND_HALF_UP), 금액은 원 단위 반올림, 품 · 기간은 0.5 올림. */
const CALC = (() => {
  const FORMULA_VERSION = "2026.11.1", PRICE_VER = "2026H2", PYEONG_M2 = 3.3058, VAT = 0.1;
  const EPS = 1e-7;
  const won = (x) => Math.floor(x + 0.5 + EPS);
  const m2 = (x) => Math.floor(x * 10 + 0.5 + EPS) / 10;
  const halfUp = (x) => Math.ceil(x * 2 - EPS) / 2;
  const halfDays = (md, crew) => Math.max(Math.ceil((md / crew) * 2 - EPS), 1);
  const pyToM2 = (p) => m2(p * PYEONG_M2);
  function withVat(supply) { const vat = won(supply * VAT); return { supply, vat, total: supply + vat }; }
  function fromEntered(amount, mode) {
    if (mode === "excluded") return withVat(amount);
    if (mode === "included") { const supply = won(amount / 1.1); return { supply, vat: amount - supply, total: amount }; }
    return { supply: amount, vat: 0, total: amount };
  }
  const COUNTED = new Set(["included", "separate"]);
  const sumLines = (lines) => lines.filter((l) => COUNTED.has(l.state) && l.amount != null).reduce((a, l) => a + l.amount, 0);
  const line = (key, name, qty, unit, unit_price, amount, state, source, basis = "public", calc = "") => ({ key, name, qty, unit, unit_price, amount, state, source, basis, calc });

  /* ---- 도배 (refprice/book.py DOBAE_2026H2) ---- */
  const LABOR_NORMAL = 172698;
  const DB = {
    labor_wall: 5993, labor_ceiling: 8531, labor_ratio: 0.96, paper: { basic: 3325, economy: 1300 }, primer: 242,
    removal: won(0.01 * LABOR_NORMAL), paper_ratio: 1.2, primer_wall_ratio: 1.2, primer_ceiling_ratio: 0.8,
    md_wall: 0.024, md_ceiling: 0.027 * 1.3, occupied_output: 0.85, area_factor: { supply: 2.5, exclusive: 3.0 },
    ceiling_share: 0.25, balcony_factor: 1.08, crew: 4,
    src: {
      wall: "표준시장단가 2026 하반기 · 도배지바름 콘크리트 · 모르타르 벽",
      ceiling: "표준시장단가 2026 하반기 · 도배지바름 석고 · 합판 천장",
      paper_basic: "조달청 가격정보 비닐벽지 (2026-10 조회, 실크 대용)",
      paper_economy: "팀 가정값 (합지는 공공 가격이 없어요)",
      primer: "조달청 가격정보 초배지 (2026-10 조회) · 소요량 표준품셈",
      occupied: "표준품셈 · 짐 있는 집 시공량 15% 감산, 노무비에만",
      removal: "표준품셈 벽지 떼내기 × 2026.9.1 보통인부 노임",
      none: "공공 단가가 없어 업체 견적에서 확인해요"
    }
  };
  function dobae({ area_m2, area_basis = "supply", grade = "basic", include_ceiling = true, occupied = false, balcony_ext = false, measured = null }) {
    if (!(area_m2 > 0)) throw new Error("면적은 0보다 커야 해요");
    const f = DB.area_factor[area_basis];
    let gross = area_m2 * f; if (balcony_ext) gross *= DB.balcony_factor;
    let ceiling = m2(gross * DB.ceiling_share), wall = m2(m2(gross) - ceiling);
    if (measured) { wall = m2(measured.wall_m2); ceiling = m2(measured.ceiling_m2); gross = wall + ceiling; } // v9: 도면에서 잰 면적
    const ceilUsed = include_ceiling ? ceiling : 0, paperArea = m2(wall + ceilUsed);
    const paperQty = m2(paperArea * DB.paper_ratio), primerQty = m2(wall * DB.primer_wall_ratio + ceilUsed * DB.primer_ceiling_ratio);
    const gname = grade === "economy" ? "합지" : "실크";
    const L = [
      line("wall", "벽 도배 시공 (풀 포함)", wall, "㎡", DB.labor_wall, won(wall * DB.labor_wall), "included", DB.src.wall, "public",
        measured ? `도면 ${measured.name}에서 방마다 잰 벽 면적(문 · 창 뺌)` : `벽 면적 = 도배 면적 ${m2(gross)}㎡ − 천장 ${ceiling}㎡ (도배 면적 = ${area_basis === "supply" ? "공급" : "전용"} ${area_m2}㎡ × ${f}${balcony_ext ? " × 1.08" : ""})`),
      line("ceiling", "천장 도배 시공 (풀 포함)", ceiling, "㎡", DB.labor_ceiling, include_ceiling ? won(ceiling * DB.labor_ceiling) : null, include_ceiling ? "included" : "excluded", DB.src.ceiling, "public",
        measured ? `도면 ${measured.name}에서 잰 천장 면적` : `천장 = 도배 면적 × 0.25`),
      line("paper", `도배지 (${gname})`, paperQty, "㎡", DB.paper[grade], won(paperQty * DB.paper[grade]), "included", DB.src["paper_" + grade], grade === "basic" ? "public" : "assumed",
        `바를 면적 ${paperArea}㎡ × 소요량 1.2`),
      line("primer", "초배지", primerQty, "㎡", DB.primer, won(primerQty * DB.primer), "included", DB.src.primer, "public",
        `벽 ${wall}㎡ × 1.2 + 천장 ${ceilUsed}㎡ × 0.8`)
    ];
    if (occupied) {
      const labor = L[0].amount + (include_ceiling ? L[1].amount : 0);
      L.push(line("occupied", "짐 있는 집 작업 할증", null, "식", null, won(labor * DB.labor_ratio * (1 / DB.occupied_output - 1)), "included", DB.src.occupied, "public",
        `시공 노무비 ${labor.toLocaleString("ko-KR")}원 × 노무 비율 0.96 × (1 ÷ 0.85 − 1)`));
    }
    L.push(line("removal", "기존 벽지 철거", paperArea, "㎡", DB.removal, won(paperArea * DB.removal), "after_visit", DB.src.removal, "public", `보통인부 노임 172,698원 × 0.01`));
    L.push(line("waste", "폐기물 처리", null, "식", null, null, "after_visit", DB.src.none, "none"));
    if (occupied) L.push(line("moving", "짐 이동 · 보양", null, "식", null, null, "after_visit", DB.src.none, "none"));
    const supply = sumLines(L);
    let md = wall * DB.md_wall + ceilUsed * DB.md_ceiling; if (occupied) md /= DB.occupied_output;
    const man_days = halfUp(md);
    const steps = [];
    if (occupied) steps.push({ key: "prep", name: "짐 정리 · 보양", half_days: 1 });
    steps.push({ key: "paper", name: include_ceiling ? "벽지 바르기 (벽 · 천장)" : "벽지 바르기 (벽)", half_days: halfDays(man_days, DB.crew) });
    steps.push({ key: "finish", name: "마감 · 확인 · 청소", half_days: 1 });
    const notes = [...(measured ? [`벽 · 천장 면적은 도면 ${measured.name}에서 방마다 재서 더했어요(문 · 창 뺌). 실측 전 어림이라 실측 때 다시 재요.`] : [`도배 면적은 ${area_basis === "supply" ? "공급면적" : "전용면적"} × ${f}로 추정했어요. 실측 때 방마다 다시 재요.`, "천장은 도배 면적의 25%로 잡았어요."]), `하루 도배공 ${DB.crew}명이 들어가는 것으로 기간을 잡았어요.`];
    if (balcony_ext && !measured) notes.push("발코니 확장은 도배 면적을 1.08배로 잡았어요.");
    return { trade: "dobae", ko: "도배", lines: L, ...withVat(supply), man_days, md_raw: md, crew: DB.crew, steps, days: steps.reduce((a, s) => a + s.half_days, 0) / 2, notes, grade };
  }

  /* ---- 목공 (MOKGONG_2026H2) ---- */
  const MG = {
    molding: 8168, molding_mat: 3000, molding_ratio: 1.1, base: 3757, base_mat: 2000, base_ratio: 1.04,
    door_install: 82339, door_leaf_install: won(82339 / 2), door_set_mat: 260000, door_leaf_mat: 150000,
    casing: 2314, casing_per_door: 10.2, frame: 11054, board: 12937, ceiling_mat: 8000,
    md_molding: 0.035, md_base: 2 / 165, md_door: 0.313, md_casing: 0.010, md_frame: 0.0323, md_board: 2 / 45,
    molding_per_py: 2.4, base_per_py: 1.8, supply_per_exclusive: 1.2, flatten_share: 0.3, crew: 2,
    src: {
      molding: "표준시장단가 2026 하반기 · 몰딩 설치 (재료 제외)", base: "표준시장단가 2026 하반기 · 걸레받이 MDF (재료 제외)",
      door: "표준시장단가 2026 하반기 · 목재창호 설치 여닫이 1.0~3.0㎡ (재료 제외)", casing: "표준시장단가 2026 하반기 · 문선 (재료 제외)",
      frame: "표준시장단가 2026 하반기 · 경량천장틀 BAR 간격 450", board: "표준시장단가 2026 하반기 · 천장 석고판 1겹",
      ceiling_mat: "팀 가정값 (천장틀 · 석고보드 자재 공공 가격이 없어요)", door_mat: "팀 가정값 (ABS 문 자재 공공 가격이 없어요)",
      molding_mat: "팀 가정값 (몰딩 자재 공공 가격이 없어요)", base_mat: "팀 가정값 (걸레받이 자재 공공 가격이 없어요)",
      leaf: "팀 가정값 (문짝만 설치는 문 설치 공공 단가의 절반)", none: "공공 단가가 없어 업체 견적에서 확인해요"
    }
  };
  function mokgong({ area_m2, area_basis = "supply", items = ["molding", "base"], occupied = false, doors = 0, door_frame = true, measured = null }) {
    if (!(area_m2 > 0)) throw new Error("면적은 0보다 커야 해요");
    if (!items.length) throw new Error("목공 항목을 하나 이상 골라야 해요");
    if (items.includes("door") && !(doors > 0)) throw new Error("방문 개수를 넣어야 해요");
    const supply_m2 = area_basis === "supply" ? area_m2 : m2(area_m2 * MG.supply_per_exclusive);
    const exclusive = area_basis === "supply" ? m2(area_m2 / MG.supply_per_exclusive) : area_m2;
    const py = supply_m2 / PYEONG_M2;
    const L = []; let mdCeil = 0, mdDoor = 0, mdTrim = 0;
    if (items.includes("flatten")) {
      const fl = m2(exclusive * MG.flatten_share), c = `전용 ${exclusive}㎡ × 0.3`;
      L.push(line("frame", "천장 평탄화 · 경량천장틀", fl, "㎡", MG.frame, won(fl * MG.frame), "included", MG.src.frame, "public", c));
      L.push(line("board", "천장 평탄화 · 석고보드 1겹", fl, "㎡", MG.board, won(fl * MG.board), "included", MG.src.board, "public", c));
      L.push(line("ceiling_mat", "천장틀 · 석고보드 자재", fl, "㎡", MG.ceiling_mat, won(fl * MG.ceiling_mat), "included", MG.src.ceiling_mat, "assumed", c));
      mdCeil = fl * (MG.md_frame + MG.md_board);
    }
    if (items.includes("door")) {
      if (door_frame) {
        const cas = m2(MG.casing_per_door * doors);
        L.push(line("door", "방문 교체 (문틀 · 문짝)", doors, "개", MG.door_install, won(doors * MG.door_install), "included", MG.src.door, "public", `방문 ${doors}개`));
        L.push(line("casing", "문선 설치 (문 둘레 양면)", cas, "m", MG.casing, won(cas * MG.casing), "included", MG.src.casing, "public", `문 하나에 양면 10.2m × ${doors}개`));
        L.push(line("door_mat", "방문 자재 (ABS 문틀 · 문짝 · 문선)", doors, "개", MG.door_set_mat, won(doors * MG.door_set_mat), "included", MG.src.door_mat, "assumed", `방문 ${doors}개`));
        mdDoor = doors * MG.md_door + cas * MG.md_casing;
      } else {
        L.push(line("door", "방문 교체 (문짝만)", doors, "개", MG.door_leaf_install, won(doors * MG.door_leaf_install), "included", MG.src.leaf, "assumed", `방문 ${doors}개`));
        L.push(line("door_mat", "방문 자재 (ABS 문짝)", doors, "개", MG.door_leaf_mat, won(doors * MG.door_leaf_mat), "included", MG.src.door_mat, "assumed", `방문 ${doors}개`));
        mdDoor = doors * MG.md_door;
      }
    }
    if (items.includes("molding")) {
      const len = measured ? m2(measured.molding_m) : m2(py * MG.molding_per_py), mat = m2(len * MG.molding_ratio);
      L.push(line("molding", "천장 몰딩 설치", len, "m", MG.molding, won(len * MG.molding), "included", MG.src.molding, "public", measured ? `도면 ${measured.name}에서 잰 천장 둘레` : `공급 ${m2(py)}평 × 2.4m`));
      L.push(line("molding_mat", "몰딩 자재", mat, "m", MG.molding_mat, won(mat * MG.molding_mat), "included", MG.src.molding_mat, "assumed", `몰딩 ${len}m × 1.1`));
      mdTrim += len * MG.md_molding;
    }
    if (items.includes("base")) {
      const len = measured ? m2(measured.base_m) : m2(py * MG.base_per_py), mat = m2(len * MG.base_ratio);
      L.push(line("base", "걸레받이 설치 (MDF)", len, "m", MG.base, won(len * MG.base), "included", MG.src.base, "public", measured ? `도면 ${measured.name}에서 잰 바닥 둘레(문 · 큰 창 뺌)` : `공급 ${m2(py)}평 × 1.8m`));
      L.push(line("base_mat", "걸레받이 자재", mat, "m", MG.base_mat, won(mat * MG.base_mat), "included", MG.src.base_mat, "assumed", `걸레받이 ${len}m × 1.04`));
      mdTrim += len * MG.md_base;
    }
    const after = (k, n) => L.push(line(k, n, null, "식", null, null, "after_visit", MG.src.none, "none"));
    if (items.includes("flatten")) after("remove_ceiling", "기존 등박스 · 우물천장 철거");
    if (items.includes("door") && door_frame) after("remove_door", "기존 방문 · 문틀 철거");
    if (items.includes("molding") || items.includes("base")) after("remove_trim", "기존 몰딩 · 걸레받이 철거");
    after("waste", "폐기물 처리");
    if (occupied) after("moving", "짐 이동 · 보양");
    const steps = [];
    if (occupied) steps.push({ key: "prep", name: "짐 정리 · 보양", half_days: 1 });
    if (items.some((i) => i === "flatten" || i === "molding" || i === "base")) steps.push({ key: "remove", name: "철거 · 바탕 정리", half_days: 1 });
    if (mdCeil) steps.push({ key: "ceiling", name: "천장 평탄화 (틀 · 석고보드)", half_days: halfDays(mdCeil, MG.crew) });

    if (mdTrim) steps.push({ key: "trim", name: ["몰딩", "걸레받이"].filter((_, i) => items.includes(["molding", "base"][i])).join(" · "), half_days: halfDays(mdTrim, MG.crew) });
    steps.push({ key: "finish", name: "정리 · 청소", half_days: 1 });
    const man_days = halfUp(mdCeil + mdDoor + mdTrim);
    const notes = [];
    if (area_basis === "exclusive") notes.push("공급면적은 전용면적 × 1.2로 환산했어요.");
    if (items.includes("molding")) notes.push(measured ? `몰딩 길이는 도면 ${measured.name}에서 방마다 잰 천장 둘레예요. 실측 때 다시 재요.` : "몰딩 길이는 공급 1평에 2.4m로 집 전체를 잡았어요. 실측 때 방마다 다시 재요.");
    if (items.includes("base")) notes.push(measured ? `걸레받이 길이는 도면 ${measured.name}에서 방마다 잰 바닥 둘레예요(문 · 큰 창 뺌). 실측 때 다시 재요.` : "걸레받이 길이는 공급 1평에 1.8m로 집 전체를 잡았어요. 실측 때 방마다 다시 재요.");
    if (items.includes("flatten")) notes.push("평탄화 면적은 전용면적의 30%(거실 천장 정도)로 잡았어요.");
    if (items.includes("door")) notes.push(door_frame ? "문 설치 · 문선은 표준시장단가(재료 제외), 문 자재는 ABS 문 기준 팀 가정값이에요. 문 하나에 문선 양면 10.2m로 잡았어요." : "문짝만 설치는 문 설치 공공 단가의 절반, 문짝 자재는 팀 가정값이에요.");
    notes.push(`하루 목수 ${MG.crew}명이 들어가는 것으로 기간을 잡았어요.`);
    return { trade: "mokgong", ko: "목공", lines: L, ...withVat(sumLines(L)), man_days, crew: MG.crew, steps, days: steps.reduce((a, s) => a + s.half_days, 0) / 2, notes };
  }

  /* ---- 공정표 (calc/schedule.py fix_plan, refprice/holidays.py) ---- */
  const HOLIDAYS = {
    "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴", "2026-03-02": "삼일절 대체공휴일", "2026-05-05": "어린이날",

/* v5 화면 다듬기: 스타일마다 20가지 느낌(LOOKS, 많이 고르는 순) · 첫 화면 · 고른 느낌의 색으로 자재 추천 */
const LOOK_BY = Object.fromEntries(Object.entries(LOOKS).flatMap(([sid, ls]) => ls.map((l) => [l.id, { ...l, style: sid }])));
const lookOf = (id) => (id ? LOOK_BY[id] || null : null);
const TONE_KEY = { floor: "floor", wallpaper: "wall", paint: "wall", film: "wood", carpentry: "wood", furniture: "wood", middoor: "wood", tile: "tile", bath: "tile" };
const TONE_KO = { floor: "바닥", wall: "벽", wood: "나무 · 문", tile: "타일" };
const rgbOf = (x) => { const n = parseInt(String(x).slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
/* 고른 느낌의 색과 자재 색이 가까울수록 0~1.5점 */
function toneFit(m) {
  const lk = lookOf(S.look), k = TONE_KEY[m.cat], t = lk && lk.style === S.style && k && lk.tone[k];
  if (!t || !m.color) return 0;
  const a = rgbOf(t), b = rgbOf(m.color), d = Math.sqrt(2 * (a[0] - b[0]) ** 2 + 4 * (a[1] - b[1]) ** 2 + 3 * (a[2] - b[2]) ** 2);

  const A = {

    piece_m: 2.4,            // 몰딩 · 걸레받이 한 개 길이
    primer_wall: 1.2, primer_ceiling: 0.8, // 초배지 소요량(팀 계산 엔진과 같음)

  const PAPERED = { full: 1, kitchen: A.kitchen_share, none: 0 };

  /* 공간 하나: 안목 치수(중심선 − 벽 두께) */
  function space(sp, plan, o) {
    const t = (plan.wall_mm?.int ?? 180) / 1000;
    const extOff = !o.expanded && sp.ext ? sp.ext / 1000 : 0;
    let w = sp.w / 1000 - t, d = sp.d / 1000 - t;
    if (sp.ext_side === "w") w -= extOff; else d -= extOff;

/* 상담 범위가 '일부만'이면 그 공간 종류만(거실 · 방 = 거실 · 방 · 복도 · 드레스룸) */

/* 고른 도면을 상태에 넣는다(평형이 비었으면 공급 평형, 방문 개수) */

}
